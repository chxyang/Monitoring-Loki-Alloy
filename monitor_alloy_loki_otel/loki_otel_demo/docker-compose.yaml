version: '3.8'

services:
  # OpenTelemetry Collector (Contrib 版本)
  otel-collector:
    image: otel/opentelemetry-collector-contrib
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Metrics endpoint
    depends_on:
      - prometheus
      - loki
      - tempo

  # Alloy (统一配置)
  alloy:
    image: grafana/alloy
    volumes:
      - ./alloy-config.river:/etc/alloy/config.river
    command: ["run", "/etc/alloy/config.river"]
    ports:
      - "12345:12345" # Alloy metrics

  # Prometheus
  prometheus:
    image: prom/prometheus:v2.51.2
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml
    ports:
      - "9090:9090"

  # Loki
  loki:
    image: grafana/loki:3.0.0
    ports:
      - "3100:3100"

  # Tempo (分布式追踪)
  tempo:
    image: grafana/tempo:2.3.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml
    ports:
      - "3200:3200"   # Tempo

  # Grafana
  grafana:
    image: grafana/grafana:11.0.0
    environment:
      - GF_FEATURE_TOGGLES_ENABLE=tempoSearch tempoBackendSearch
    volumes:
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
      - tempo